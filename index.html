<script>
window.__ankiReady = new Promise(function (resolve) { window.__ankiResolve = resolve; });
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyCKJqu118OALWO0AeTSIm_uvM9QBQuMuvg",
    authDomain: "anki-hype.firebaseapp.com",
    projectId: "anki-hype",
    storageBucket: "anki-hype.firebasestorage.app",
    messagingSenderId: "885622730342",
    appId: "1:885622730342:web:c43df510e02585437987a7"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var errEl, btnEl;
  function unlock(uid){
    document.getElementById('lockscreen').remove();
    document.body.classList.remove('hype-locked');
    window.__ankiResolve({ uid: uid, db: firebase.firestore() });
  }
  function fail(msg){
    errEl.textContent = msg;
    btnEl.disabled = false; btnEl.textContent = 'Entrar';
  }
  function tryLogin(){
    var email = (document.getElementById('lockemail').value || '').trim();
    var pw = document.getElementById('lockpw').value || '';
    errEl.textContent = '';
    if (!email || !pw) { fail('Preencha e-mail e senha.'); return; }
    btnEl.disabled = true; btnEl.textContent = 'Entrando…';
    auth.signInWithEmailAndPassword(email, pw).catch(function (e) {
      var msgs = { 'auth/invalid-email': 'E-mail inválido.', 'auth/user-not-found': 'Usuário não encontrado.', 'auth/wrong-password': 'Senha incorreta.', 'auth/invalid-credential': 'E-mail ou senha incorretos.', 'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco.' };
      fail(msgs[e.code] || 'Não foi possível entrar.');
    });
  }
  document.addEventListener('DOMContentLoaded', function () {
    errEl = document.getElementById('lockerr'); btnEl = document.getElementById('lockbtn');
    btnEl.addEventListener('click', tryLogin);
    ['lockemail', 'lockpw'].forEach(function (id) {
      document.getElementById(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') tryLogin(); });
    });
  });
  auth.onAuthStateChanged(function (user) { if (user) unlock(user.uid); });
})();

<title>Anki Hype</title>
<style>
/* Identidade visual Victa (mesma da Calculadora de Ensaio de Solo): Arial, verde #015021 em poucos tons,
   lima #43CE03 só como destaque, faixa de cabeçalho em gradiente, cartões de 16px com sombra suave. */
:root {
  color-scheme: light;
  --font: Arial, 'Helvetica Neue', Helvetica, 'Liberation Sans', sans-serif;

  --bg: #EDF2EE;
  --surface: #F3F8F3;
  --raised: #FFFFFF;
  --tile: #F3F8F3;
  --ink: #0F2A1A;
  --ink-2: #3F5648;
  --ink-3: #5A6F62;
  --line: #D5DFD8;
  --line-strong: #C3D2C7;
  --accent: #015021;
  --accent-ink: #FFFFFF;
  --accent-soft: #D3F3C4;
  --accent-text: #013D17;
  --lime: #43CE03;
  --again: #B3261E;
  --hard: #8A5A00;
  --good: #0A6E2C;
  --easy: #0B6472;
  --flag: #8A5A00;
  --flag-soft: #F6EBC8;

  --c-bar: #0A6E2C;
  --c-new: #C3D2C7;
  --c-learn: #7CDB3A;
  --c-young: #2FA800;
  --c-mature: #015021;
  --grid: #DDE6DF;

  --page: linear-gradient(180deg, #F5F9F5 0%, #E4EDE6 100%);
  --band: linear-gradient(135deg, #013D17 0%, #015021 50%, #0A6E2C 100%);
  --grad-primary: linear-gradient(135deg, #015021 0%, #0B7A32 100%);
  --grad-seg: linear-gradient(90deg, #015021 0%, #43CE03 100%);
  --shadow: 0 1px 2px rgba(1, 40, 15, .05), 0 18px 40px -20px rgba(1, 40, 15, .28);
  --shadow-btn: 0 8px 18px -8px rgba(1, 80, 33, .55);

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --radius: 12px;
  --radius-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B140E; --surface: #16291D; --raised: #101D15; --tile: #16291D;
    --ink: #E4F1E8; --ink-2: #B4C9BB; --ink-3: #8CA595;
    --line: #213629; --line-strong: #2C4434;
    --accent: #43CE03; --accent-ink: #013D17; --accent-soft: #1B3A26; --accent-text: #BFEFA6;
    --again: #F2A89E; --hard: #E0B04A; --good: #7CDB3A; --easy: #5CC4D4;
    --flag: #E0B04A; --flag-soft: #3A3016;
    --c-bar: #43CE03; --c-new: #2C4434; --c-learn: #2E7A3E; --c-young: #43CE03; --c-mature: #D3F3C4; --grid: #1B2E22;
    --page: radial-gradient(1200px 500px at 50% -10%, rgba(67, 206, 3, .10), transparent 60%), linear-gradient(180deg, #08130C 0%, #0B1710 100%);
    --band: linear-gradient(135deg, #012A10 0%, #013D17 55%, #0A5A25 100%);

    --shadow-btn: 0 8px 18px -8px rgba(67, 206, 3, .45);
  }
}

  --again: #F2A89E; --hard: #E0B04A; --good: #7CDB3A; --easy: #5CC4D4;

  --c-bar: #43CE03; --c-new: #2C4434; --c-learn: #2E7A3E; --c-young: #43CE03; --c-mature: #D3F3C4; --grid: #1B2E22;
  --page: radial-gradient(1200px 500px at 50% -10%, rgba(67, 206, 3, .10), transparent 60%), linear-gradient(180deg, #08130C 0%, #0B1710 100%);

  --shadow-btn: 0 8px 18px -8px rgba(67, 206, 3, .45);
}

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page); min-height: 100vh;
  color: var(--ink);
  font: 400 16px/1.5 var(--font);

  padding-inline: var(--s4);

}
.wrap { max-width: 46rem; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3, p { margin: 0; }
main { display: flex; flex-direction: column; gap: var(--s5); min-width: 0; }
main > section { display: flex; flex-direction: column; gap: var(--s3); }
main > section > .sec-title + div[style] { display: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font: 700 11.5px/1.2 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

/* Cabeçalho em faixa com gradiente e as duas marcas */
.top { display: flex; flex-direction: column; gap: var(--s4); }
.band {
  position: relative; overflow: hidden; isolation: isolate;
  padding: 18px 24px 24px; border-radius: var(--radius-lg);

  display: flex; flex-direction: column; gap: 22px;
}
.band::after {
  content: ""; position: absolute; z-index: -1; right: -120px; top: -160px; width: 420px; height: 420px; border-radius: 50%;
  background: radial-gradient(circle, rgba(67, 206, 3, .38) 0%, rgba(67, 206, 3, 0) 65%);
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding-bottom: var(--s4); border-bottom: 1px solid rgba(211, 243, 196, .2); }
.brand { display: flex; align-items: center; gap: var(--s5); min-width: 0; }
.brand .logo { display: block; width: auto; max-width: 100%; }
.brand .logo.victa { height: 14px; }
.brand .logo.hype { height: 34px; }
.band h1 { color: #fff; font: 700 clamp(24px, 5vw, 30px)/1.12 var(--font); letter-spacing: -.01em; }
.band .sub { color: #D3F3C4; font-size: 14px; margin-top: 6px; }
.theme {
  flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(255, 255, 255, .1); color: #fff; border: 1px solid rgba(255, 255, 255, .25);
}
.theme:hover { background: rgba(255, 255, 255, .18); }
.theme .ic-sun { display: none; }
.is-dark .theme .ic-sun { display: block; }
.is-dark .theme .ic-moon { display: none; }

/* Abas: régua de quatro segmentos, como as etapas da calculadora */
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tab { background: transparent; border: 0; padding: 0 0 var(--s2); color: var(--ink-3); display: flex; flex-direction: column; gap: var(--s2); text-align: left; min-width: 0; min-height: 44px; }
.tab .tseg { display: block; height: 5px; width: 100%; border-radius: 3px; background: var(--line-strong); }
.tab .t { font-size: 13.5px; line-height: 1.2; font-weight: 400; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] .tseg { background: var(--grad-seg); }
.tab[aria-current="page"] .t { font-weight: 700; }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 48px; padding: 0 var(--s4); border: 1px solid var(--line-strong); background: var(--raised); color: var(--ink); border-radius: var(--radius); font-weight: 700; font-size: 15px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--grad-primary); border: 0; color: var(--accent-ink); box-shadow: var(--shadow-btn); }
.btn.primary:hover { filter: brightness(1.06); color: var(--accent-ink); }

.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }

/* Início */
.today { background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); display: grid; gap: var(--s4); padding: var(--s5) var(--s4); }
.today-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.today h2 { font: 700 22px/1.1 var(--font); color: var(--accent); }
.counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.count { display: flex; flex-direction: column; gap: var(--s1); padding: var(--s3) var(--s4); background: var(--tile); border-radius: var(--radius); }
.count b { font: 700 38px/1 var(--font); }
.count.n b { color: var(--accent); } .count.l b { color: var(--again); } .count.r b { color: var(--good); }
.count.zero b { color: var(--ink-3); }
.sec-title { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); }
.sec-title h2 { display: flex; align-items: center; gap: 10px; font: 700 18px/1.1 var(--font); color: var(--ink); }
.sec-title h2::before { content: ""; flex: none; width: 4px; height: 16px; border-radius: 2px; background: var(--grad-seg); }
.topics, .list { display: flex; flex-direction: column; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; }
.topic { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 3.4rem) 1.25rem; align-items: center; gap: var(--s2); width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: var(--s3) var(--s4); min-height: 52px; }
.topic:last-child, .item:last-child { border-bottom: 0; }
.topic:hover, .item:hover { background: var(--tile); }
.topic .name { font-weight: 700; overflow-wrap: anywhere; }
.topic .num { text-align: right; font: 400 15px/1 var(--font); color: var(--ink-3); }
.topic .num.on { font-weight: 700; }
.topic .num.on.n { color: var(--accent); } .topic .num.on.l { color: var(--again); } .topic .num.on.r { color: var(--good); }

.topics-head { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 3.4rem) 1.25rem; gap: var(--s2); padding: 0 var(--s4) var(--s2); }

.topics-head span:first-child { text-align: left; }

/* Estudo */
.study-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.study-bar .scope { font: 700 18px/1.1 var(--font); color: var(--accent); }
.pills { display: flex; gap: var(--s4); font: 400 14px/1 var(--font); }
.pills span { display: inline-flex; gap: var(--s2); align-items: baseline; color: var(--ink-3); }
.pills b { font-weight: 700; }
.pills .n b { color: var(--accent); } .pills .l b { color: var(--again); } .pills .r b { color: var(--good); }
.pills .cur b { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }

.sheet { background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; }
.tb { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; background: var(--tile); border-bottom: 1px solid var(--line); font: 700 11.5px/1.2 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.tb > span { padding: var(--s3) var(--s4); }
.tb .code { color: var(--accent); }
.tb .topic-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.face { padding: var(--s5) var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
.q, .a { font-size: 19px; line-height: 1.55; overflow-wrap: anywhere; }
.a { color: var(--ink); }

.cl { border-radius: 4px; padding: 0 var(--s1); }
.cl-hide { background: var(--accent-soft); color: var(--accent-text); font-weight: 700; white-space: nowrap; }
.cl-on { background: var(--accent-soft); color: var(--accent-text); font-weight: 700; }
.fig { margin: 0; display: flex; flex-direction: column; gap: var(--s2); }
.fig img { width: 100%; max-height: 22rem; object-fit: contain; background: var(--tile); border: 1px solid var(--line); border-radius: var(--radius); cursor: zoom-in; }
.fig figcaption { font-size: 13px; line-height: 1.4; color: var(--ink-3); }
img.zoom { width: 100%; height: auto; border-radius: var(--radius); background: var(--tile); }
.cota { display: flex; align-items: center; gap: var(--s3); color: var(--ink-3); font: 700 11px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; }

.actions { display: flex; flex-direction: column; gap: var(--s3); }

.grade:hover { border-color: var(--accent); }
.grade .gl { font-weight: 700; font-size: 14.5px; }
.grade .gi { font: 400 12px/1 var(--font); color: var(--ink-3); }
.grade.g1 .gl { color: var(--again); } .grade.g2 .gl { color: var(--hard); } .grade.g3 .gl { color: var(--good); } .grade.g4 .gl { color: var(--easy); }
.reveal { width: 100%; min-height: 56px; font-size: 17px; }
.tools { display: flex; justify-content: center; gap: var(--s2); flex-wrap: wrap; }
.kbd { font: 400 12px/1 var(--font); color: var(--ink-3); text-align: center; }

.done { background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: var(--s6) var(--s4); display: flex; flex-direction: column; gap: var(--s4); align-items: flex-start; }
.done h2 { font: 700 24px/1.1 var(--font); color: var(--accent); }
.done p { color: var(--ink-2); max-width: 36rem; }
.row { display: flex; gap: var(--s3); flex-wrap: wrap; }

/* Cartões (navegador) */
.toolbar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s2); }
.toolbar .search { grid-column: 1 / -1; }
.field { width: 100%; min-height: 48px; padding: 0 var(--s3); background: var(--raised); border: 1px solid var(--line-strong); border-radius: 10px; }
.field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
select.field { padding: 0 var(--s2); font-size: 15px; }
textarea.field { padding: var(--s3); min-height: 96px; resize: vertical; line-height: 1.5; }
.item { display: grid; grid-template-columns: 5.6rem minmax(0, 1fr) auto; gap: var(--s3); align-items: start; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: var(--s3) var(--s4); }
.item .code { font: 700 12.5px/1.5 var(--font); color: var(--accent); text-transform: uppercase; padding-top: 2px; }
.item .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.chips { display: flex; flex-direction: column; align-items: flex-end; gap: var(--s1); }
.chip { font: 700 11px/1 var(--font); letter-spacing: .04em; padding: 5px var(--s2); border: 1px solid var(--line-strong); border-radius: 999px; color: var(--ink-2); white-space: nowrap; }
.chip.warn { color: var(--flag); border-color: var(--flag); background: var(--flag-soft); }
.chip.sus { color: var(--ink-3); border-style: dashed; }
.empty { padding: var(--s6) var(--s2); color: var(--ink-3); text-align: center; }

/* Estatísticas */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: var(--s3); }
.tile { background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
.tile b { font: 700 36px/1 var(--font); color: var(--accent); }
.panel { background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
.panel h3 { display: flex; align-items: center; gap: 10px; font: 700 17px/1.1 var(--font); }
.panel h3::before { content: ""; flex: none; width: 4px; height: 16px; border-radius: 2px; background: var(--grad-seg); }
.panel .hint { color: var(--ink-3); font-size: 13.5px; }
.plot { position: relative; height: 150px; margin-left: 2rem; }
.gl-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--grid); }
.gl-line.base { border-top-color: var(--line-strong); }
.gl-line span { position: absolute; left: -2rem; top: -8px; width: 1.7rem; text-align: right; font: 400 11px/1 var(--font); color: var(--ink-3); }
.cols { position: absolute; inset: 0; display: flex; align-items: stretch; gap: 2px; }
.col { flex: 1 1 0; min-width: 0; position: relative; display: flex; justify-content: center; align-items: flex-end; border-radius: 2px; }
.col:hover, .col:focus-visible { background: var(--tile); }
.col .bar { width: 100%; max-width: 24px; background: var(--c-bar); border-radius: 4px 4px 0 0; min-height: 0; }
.col .val { position: absolute; font: 700 11px/1 var(--font); color: var(--ink-2); }
.xlabels { display: flex; gap: 2px; margin-left: 2rem; margin-top: var(--s2); }
.xlabels span:last-child { text-align: right; }
.xlabels span { flex: 1 1 0; min-width: 0; text-align: center; font: 400 11px/1 var(--font); color: var(--ink-3); }
.seg { display: flex; gap: 2px; height: 20px; }
.seg i { display: block; min-width: 4px; }
.seg i:first-child { border-radius: 6px 0 0 6px; } .seg i:last-child { border-radius: 0 6px 6px 0; } .seg i:only-child { border-radius: 6px; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); gap: var(--s2) var(--s4); }
.legend div { display: flex; align-items: center; gap: var(--s2); font-size: 14.5px; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.legend .v { margin-left: auto; font: 700 13.5px/1 var(--font); color: var(--ink-2); }
details.tbl summary { cursor: pointer; color: var(--ink-2); font-size: 14px; font-weight: 700; min-height: 32px; display: flex; align-items: center; }
.tbl-wrap { overflow-x: auto; margin-top: var(--s2); }
table { border-collapse: collapse; width: 100%; font: 400 13px/1.3 var(--font); }
th, td { text-align: right; padding: var(--s1) var(--s3); border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
#tip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--bg); font: 700 12px/1.3 var(--font); padding: var(--s2) var(--s3); border-radius: 8px; max-width: 16rem; }
#tip[hidden] { display: none !important; }

/* Ajustes */
.form { display: flex; flex-direction: column; gap: var(--s4); }
.setting { display: grid; grid-template-columns: minmax(0, 1fr) 8rem; gap: var(--s2) var(--s4); align-items: center; }
.setting label { font-weight: 700; }
.setting small { display: block; color: var(--ink-3); font-size: 13px; font-weight: 400; }
.setting input[type="range"] { width: 100%; accent-color: var(--accent); }
.setting input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); justify-self: end; }
.rangeval { text-align: right; font: 700 14px/1 var(--font); }

/* Sobreposição (detalhe do cartão e formulário) */
#ov { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: color-mix(in srgb, var(--ink) 45%, transparent); padding-top: var(--s5); }
#ov[hidden] { display: none !important; }
.modal { background: var(--bg); width: 100%; max-width: 46rem; max-height: 100%; overflow: auto; border: 1px solid var(--line-strong); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: var(--s4); padding-bottom: calc(var(--s4) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--s4); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); }
.modal-head h2 { font: 700 20px/1.1 var(--font); color: var(--accent); }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: var(--s3); }
.meta div { display: flex; flex-direction: column; gap: var(--s1); padding: var(--s3); background: var(--tile); border-radius: 10px; }
.meta b { font: 700 14px/1.2 var(--font); }
.radios { display: flex; gap: var(--s4); flex-wrap: wrap; }
.radios label { display: inline-flex; gap: var(--s2); align-items: center; min-height: 44px; }
.fld { display: flex; flex-direction: column; gap: var(--s2); }
.fld > label { font-weight: 700; }
.fld small { color: var(--ink-3); font-size: 13px; }
.err { color: var(--again); font-size: 14px; }
.modal .hint { background: var(--tile); border-radius: var(--radius); box-shadow: inset 3px 0 0 var(--lime); padding: var(--s3) var(--s4); }
select, .field option { color-scheme: inherit; }
.field option { background-color: var(--raised); color: var(--ink); }

@media (max-width: 560px) {
  .band { padding: 16px 18px 20px; gap: 18px; }
  .tab .t { font-size: 12.5px; }
  .tb > span { padding: var(--s2) var(--s3); }
  .topic, .item, .topics-head { padding-inline: var(--s3); }
  .item { grid-template-columns: 4.6rem minmax(0, 1fr) auto; gap: var(--s2); }
  .grades { gap: 6px; }
}
@media (min-width: 640px) {
  #ov { align-items: center; padding: var(--s5); }
  .modal { border-radius: var(--radius-lg); max-height: 90%; }
  .face { padding: var(--s6) var(--s5); }
  .q, .a { font-size: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .grade, .topic, .item { transition: background-color .12s, border-color .12s, filter .12s; }
  .btn:active:not([disabled]) { transform: translateY(1px); }
}

<script type="application/json" id="deck-data">{"version": "v1.21", "built": "v1.21 — 2026-10-14 (remove ter-013: metragens de redes externas sem confirmação exata)", "cards": [{"id": "fun-001", "t": "b", "f": "Qual o <b>tipo de estaca</b> da fundação das torres, o <b>diâmetro</b> e a <b>quantidade</b>?", "b": "Estaca <b>hélice contínua monitorada</b>, Ø<b>400 mm</b>, <b>193 estacas por torre</b> (185 de compressão + 8 de tração para prova de carga; <b>579 no total</b>).<br>Projeto Geoteknik (V028-FUN-AP-0001/0002/0003).", "src": "V028-FUN-AP", "tags": ["Hype::Fundacao"]}, {"id": "fun-017", "t": "b", "f": "Qual a <b>armadura longitudinal</b> das estacas Ø400mm das torres?", "b": "6 barras Ø12,5mm CA-50 (C=6,00m), para estacas de compressão e de reação.", "src": "V028-FUN-AP-0001/2/3", "tags": ["Hype::Fundacao"]}, {"id": "fun-018", "t": "b", "f": "Como é a <b>espiral</b> das estacas Ø400mm?", "b": "N4 — 1 barra Ø5,0mm CA-60, passo 15cm, C=30,50m.", "src": "V028-FUN-AP-0001/2/3", "tags": ["Hype::Fundacao"]}, {"id": "fun-019", "t": "b", "f": "Como é o <b>estribo enrijecedor</b> das estacas Ø400mm?", "b": "N2 — 5 barras Ø8,0mm CA-50 (C=0,90m), com 6 espaçadores modelo MR18-40 (ou similar); N3 — 1 barra Ø8,0mm CA-50 (C=0,70m).", "src": "V028-FUN-AP-0001/2/3", "tags": ["Hype::Fundacao"]}, {"id": "fun-020", "t": "b", "f": "O <b>trecho armado</b> das estacas muda conforme o comprimento da estaca?", "b": "<b>Não.</b> O trecho armado é sempre 6,00m, independente do comprimento total da estaca, que varia por torre (T01=10,00m / T02=12,00m / T03=11,00m).", "src": "V028-FUN-AP-0001/2/3", "tags": ["Hype::Fundacao"]}, {"id": "fun-021", "t": "b", "f": "O <b>núcleo da armação</b> (gaiola) tem a mesma largura do topo à base do trecho armado?", "b": "<b>Não.</b> No topo o núcleo da gaiola é de 26cm; na base (antes de terminar a armação) reduz para 20cm. O diâmetro da estaca em si (40cm / Ø400mm) permanece constante em toda a extensão — só o núcleo interno da armação afunila.", "src": "V028-FUN-AP-0001", "tags": ["Hype::Fundacao"]}, {"id": "fun-022", "t": "b", "f": "Qual o <b>fck mínimo</b> do concreto das estacas?", "b": "fck (28 dias) ≥ 30 MPa.", "src": "V028-FUN-AP-0001/2/3", "tags": ["Hype::Fundacao"]}, {"id": "fun-023", "t": "b", "f": "Quais os parâmetros de <b>abatimento e fator água/cimento</b>?", "b": "Slump entre 220mm e 260mm; fator a/c ≤ 0,60.", "src": "V028-FUN-AP-0001/2/3", "tags": ["Hype::Fundacao"]}, {"id": "fun-024", "t": "b", "f": "Qual o <b>consumo mínimo de cimento</b> e a faixa de diâmetro do agregado?", "b": "Consumo mínimo de cimento: 350 kg/m³; diâmetro do agregado: 4,75mm a 12,5mm.", "src": "V028-FUN-AP-0001/2/3", "tags": ["Hype::Fundacao"]}, {"id": "fun-025", "t": "b", "f": "Qual o limite de <b>exsudação</b> e as normas do aço usado?", "b": "Teor de exsudação < 4%. Aço CA-50 e CA-60 conforme ABNT NBR 7480:2022 e ABNT NBR 6892-1:2013 (versão corrigida 2:2018).", "src": "V028-FUN-AP-0001/2/3", "tags": ["Hype::Fundacao"]}, {"id": "fun-026", "t": "b", "f": "Como é a <b>camada de regularização</b> sob as estacas?", "b": "5cm em concreto magro, sob o fundo da estaca.", "src": "V028-FUN-AP-0001/2/3", "tags": ["Hype::Fundacao"]}, {"id": "fun-027", "t": "b", "f": "A <b>armação das estacas do castelo d'água</b> é diferente da armação das torres?", "b": "<b>Não</b> — é idêntica (6 Ø12,5mm CA-50 longitudinal; mesmas espiral e estribo enrijecedor; trecho armado 6,00m). Muda só o comprimento total da estaca (10,00m) e a quantidade (13 estacas, sem estacas de reação).", "src": "V028-FUN-EX-0001", "tags": ["Hype::Fundacao"]}, {"id": "fun-028", "t": "b", "f": "O <b>concreto das estacas do reservatório</b> segue a mesma especificação das torres?", "b": "<b>Sim</b> — fck≥30MPa, slump 220-260mm, a/c≤0,60, consumo mín. 350kg/m³, agregado 4,75-12,5mm, exsudação <4%.", "src": "V028-FUN-EX-0001", "tags": ["Hype::Fundacao"]}, {"id": "fun-029", "t": "b", "f": "Qual a <b>carga de ensaio</b> da prova de carga e a <b>carga de trabalho</b> padrão?", "b": "Carga de ensaio: 150 tf. Carga de trabalho: 75 tf (torres) / 70 tf (reservatório).", "src": "V028-FUN-AP / V028-FUN-EX-0001", "tags": ["Hype::Fundacao"]}, {"id": "fun-030", "t": "b", "f": "O que são as <b>estacas de ensaio (EE)</b> e elas são adicionais ao quantitativo da torre?", "b": "São estacas comuns de compressão que também servem como estaca de teste da prova de carga — já estão incluídas no quantitativo total da torre (<b>não são extras</b>). Cada torre tem 2: T01 = E-39(EE-01) e E-44(EE-02); T02 = E-39(EE-03) e E-44(EE-04); T03 = E-39(EE-05) e E-143(EE-06).", "src": "V028-FUN-AP-0001/2/3 (legenda)", "tags": ["Hype::Fundacao"]}, {"id": "fun-031", "t": "b", "f": "O que são as <b>estacas de reação (ER)</b> e elas são adicionais ao quantitativo da torre?", "b": "São estacas executadas <b>exclusivamente</b> para a realização das provas de carga — essas sim são <b>adicionais</b> ao quantitativo estrutural. 8 por torre (24 no total), tração máxima de 37,5 tf cada.", "src": "V028-FUN-AP-0001/2/3 (legenda)", "tags": ["Hype::Fundacao"]}, {"id": "fun-032", "t": "b", "f": "Como as <b>estacas de ensaio e de reação</b> se organizam em cada prova de carga?", "b": "Cada torre tem 2 provas de carga (PCE-01 e PCE-02). PCE-01 usa a 1ª estaca de ensaio + 4 estacas de reação (ex. T01: EE-01 + ER-01 a ER-04). PCE-02 usa a 2ª estaca de ensaio + as outras 4 de reação (ex. T01: EE-02 + ER-05 a ER-08).", "src": "V028-FUN-AP-0001 (observações)", "tags": ["Hype::Fundacao"]}, {"id": "fun-033", "t": "b", "f": "Qual o <b>tipo e método executivo</b> das estacas do projeto?", "b": "Hélice contínua monitorada, Ø400mm, em todas as estacas do projeto (torres e reservatório).", "src": "V028-FUN-AP / V028-FUN-EX-0001", "tags": ["Hype::Fundacao"]}, {"id": "fun-034", "t": "b", "f": "Qual o <b>total geral de estacas</b> do projeto?", "b": "579 nas três torres (185 compressão + 8 ER por torre × 3) + 13 no reservatório = <b>592 estacas no total</b>.", "src": "V028-FUN-AP / V028-FUN-EX-0001", "tags": ["Hype::Fundacao"]}, {"id": "fun-035", "t": "b", "f": "Como é o <b>preparo do topo</b> das estacas?", "b": "Corte do concreto até a cota de arrasamento; camada de regularização de 5cm em concreto magro.", "src": "V028-FUN-AP-0001/2/3", "tags": ["Hype::Fundacao"]}, {"id": "fun-037", "t": "b", "f": "Há alguma <b>restrição de intervalo</b> entre a execução de estacas próximas?", "b": "Sim. Estacas com distância entre eixos inferior a 5 vezes o diâmetro não devem ser executadas em intervalo inferior a 12 horas.", "src": "V028-FUN-AP-0001/2/3", "tags": ["Hype::Fundacao"]}, {"id": "fun-038", "t": "b", "f": "Como é composta a <b>armadura do radier das torres</b>?", "b": "Tela soldada Q503 (armadura positiva, face inferior, e negativa, face superior) + armadura de reforço em barras CA-50 nas regiões dos shafts e bordas.", "src": "V028-EST-EX-0102/0103 (Qualitas)", "tags": ["Hype::Estrutura"]}, {"id": "fun-039", "t": "b", "f": "Qual o <b>peso de aço</b> do radier, por torre e no total?", "b": "<b>21.201 kgf por torre</b> (8.697kgf armadura positiva + 12.504kgf armadura negativa) — idêntico nas 3 torres. <b>≈63,6 toneladas</b> no total das 3 torres.", "src": "V028-EST-EX-0102/0103 (Qualitas)", "tags": ["Hype::Estrutura"]}, {"id": "fun-040", "t": "b", "f": "Qual o <b>cobrimento nominal e a especificação de concreto</b> do radier das torres?", "b": "Cobrimento 3,5cm. Concreto fck 35MPa, a/c 0,50, classe de agressividade ambiental III, Eci 30GPa.", "src": "V028-EST-EX-0101 (Qualitas)", "tags": ["Hype::Estrutura"]}, {"id": "fun-041", "t": "b", "f": "O <b>cobrimento</b> do radier das torres é igual ao do radier do castelo d'água?", "b": "<b>Não.</b> Torres: 3,5cm. Castelo d'água: 4,0cm.", "src": "V028-EST-EX-0101 / V028-EST-EX-0701 (Qualitas)", "tags": ["Hype::Estrutura"]}, {"id": "fun-008", "t": "b", "f": "Qual a <b>espessura</b> do radier das torres e ela é igual nas 3 torres?", "b": "<b>40cm</b>, idêntica nas 3 torres (mesmo projeto estrutural).", "src": "V028-EST-EX-0101 (Qualitas)", "tags": ["Hype::Estrutura"]}, {"id": "fun-009", "t": "b", "f": "O radier das torres aproveita o <b>solo</b> no cálculo?", "b": "<b>Não.</b> É 100% apoiado nas estacas — confirmado verbalmente pelo calculista (não consta em prancha/memorial).", "src": "Calculista (verbal)", "tags": ["Hype::Estrutura"]}, {"id": "fun-010", "t": "b", "f": "Como é a <b>fundação do castelo d'água</b>?", "b": "Radier estaqueado com <b>13 estacas</b> hélice contínua Ø400 mm de 10,00 m (130 m), carga 70 tf / 80,5 tf, arranjo circular duplo (E-01 a E-13). Fundo de vala: 5 cm de concreto magro.", "src": "V028-FUN-EX-0001 (Geoteknik)", "tags": ["Hype::Fundacao"]}, {"id": "fun-011", "t": "b", "f": "Qual a <b>espessura e a armadura</b> do radier do castelo d'água?", "b": "Espessura <b>1,10m</b>. Armadura positiva (face inferior): 31 Ø20mm CA-50 C/17; negativa (face superior): 31 Ø20mm CA-50 C/17; borda (ambas faces): 8 Ø12,5mm CA-50 C/15. Concreto fck 35MPa, a/c 0,50, classe de agressividade III. Cobrimento <b>4,0cm</b>.", "src": "V028-EST-EX-0701 (Qualitas)", "tags": ["Hype::Fundacao"]}, {"id": "fun-013", "t": "b", "f": "Quem é o <b>projetista de fundações</b> e o responsável técnico?", "b": "Geoteknik Consulting — Eng. Marcos Fábio Porto de Aguiar (CREA/CE 11080-D); radier das torres: Qualitas.", "src": "V028-FUN-EX-0001", "tags": ["Hype::Fundacao"]}, {"id": "fun-014", "t": "b", "f": "Quais <b>barras de tração/ancoragem</b> das ER são aceitas e seus comprimentos?", "b": "Dywidag GW Plus 32 mm, Incotep THB 32, Torcisão TOR-27BM e Resinex RT-05. Comprimento unitário 13/15/14 m (T01/T02/T03); total 52/60/56 m.", "src": "Apresentação Victa/Geoteknik", "tags": ["Hype::Fundacao"]}, {"id": "fun-015", "t": "b", "f": "Qual o <b>cronograma de nivelamento</b> para monitorar recalques?", "b": "00 = térreo antes da 1ª laje · 01 = após 1ª laje · 02 = após 4ª · 03 = após 7ª · 04 = após 10ª · 05 = após 13ª · 06 = após laje dos reservatórios. Depois: leituras a cada 60 dias até 60 dias após o fim da obra.", "src": "Apresentação Victa/Geoteknik", "tags": ["Hype::Fundacao"]}, {"id": "fun-016", "t": "b", "f": "Qual o <b>aço do bloco de coroamento</b> da ER/EE e a camada de preparo?", "b": "43,91 kg de aço por bloco; preparo com 5 cm de concreto magro.", "src": "Apresentação Victa/Geoteknik", "tags": ["Hype::Fundacao"]}, {"id": "imp-001", "t": "b", "f": "Qual é a <b>área construída oficial</b> do Hype?", "b": "<b>26.926,81 m²</b><br>Conforme Alvará de Construção nº AC00005523/2026 (SEUMA/PMF, emitido 15/06/2026) — idêntico ao índice de aproveitamento aprovado.", "src": "Alvará de Construção nº AC00005523/2026 (SEUMA/PMF)", "tags": ["Hype::Implantacao"]}, {"id": "imp-002", "t": "b", "f": "Quantas <b>unidades</b> tem o Hype?", "b": "<b>534 unidades</b> (12 apartamentos por pavimento tipo).", "src": "Módulo Executivo", "tags": ["Hype::Implantacao"]}, {"id": "imp-003", "t": "b", "f": "Como é composto o conjunto de torres do Hype?", "b": "<b>3 torres</b> (Linha Viver Premium, «Torres Dozão»): 2 torres T+14 e 1 torre T+14 + Rooftop.<br>Torres 01 e 03: térreo + 14 pavimentos tipo + coberta.<br><b>Torre 02 é diferente:</b> térreo + 13 pavimentos tipo + 1 pavimento rooftop = 15 pavimentos (confirmado por Alessandro).", "src": "Apresentação de Projetos BIM / Módulo Executivo", "tags": ["Hype::Implantacao"]}, {"id": "imp-004", "t": "b", "f": "Qual é o <b>sistema construtivo</b> do Hype e em qual padrão construtivo?", "b": "<b>Parede de concreto</b>, no padrão <b>MCMV F2 – Viver</b>.", "src": "Módulo Executivo", "tags": ["Hype::Implantacao"]}, {"id": "imp-005", "t": "b", "f": "Qual a <b>área do terreno</b> do Hype e qual o <b>lote</b>?", "b": "<b>10.000 m²</b>, lote <b>T135</b> — Praia do Futuro II (Santa Maria).", "src": "Apresentação BIM / Módulo Executivo", "tags": ["Hype::Implantacao"]}, {"id": "imp-006", "t": "b", "f": "Quantas <b>vagas</b> o Hype tem e qual o coeficiente?", "b": "<b>342 vagas</b> de garagem não vinculadas (coeficiente 0,6404 vaga/unidade), sendo <b>210 para carro</b> (194 regulares + 11 para idosos + 5 PCD) e <b>132 para moto</b>.", "src": "Módulo Executivo; Matrícula nº 6842 (R.77)", "tags": ["Hype::Implantacao"]}, {"id": "imp-007", "t": "b", "f": "Qual a <b>área privativa</b> total e o índice A.P./A.C. do Hype?", "b": "Área privativa <b>21.475,56 m²</b>; índice A.P./A.C. <b>0,80</b>.<br>Esse valor não é a área real total — é a <b>\"área equivalente em área de custo padrão\"</b> (metodologia NBR 12721): soma a área privativa coberta padrão (21.416,96 m²) com o equivalente de construção das áreas descobertas (varandas, jardins etc.) — dos <b>585,96 m²</b> reais de área descoberta, apenas <b>58,60 m²</b> entram nesse cálculo (equivalência ≈10%, conforme Tabela de Equivalência de Áreas da NBR 12721). A <b>área privativa real total</b> (sem essa redução) é <b>22.002,92 m²</b>.", "src": "Módulo Executivo; Quadro NBR 12721 (PF4-QUADRO-NBR-R01)", "tags": ["Hype::Implantacao"]}, {"id": "imp-008", "t": "b", "f": "Qual o <b>gabarito (altura)</b> de cada torre?", "b": "Torres 01 e 03: <b>45,03 m</b><br>Torre 02: <b>45,43 m</b><br>Diferença está no pé direito do 14º e 15º pavimentos: <b>14º pavimento +5 cm</b> e <b>15º pavimento +35 cm</b> na Torre 02, em função do rooftop contido nela.", "src": "Apresentação Victa/Geoteknik", "tags": ["Hype::Implantacao"]}, {"id": "imp-009", "t": "b", "f": "Qual a <b>cota de piso</b> de cada torre (terraplenagem)?", "b": "T01 = <b>12,50</b> · T02 = <b>12,15</b> · T03 = <b>11,55</b><br>Bate com fundação/radier. Na arquitetura: 12,50 / 12,13 / 11,53 (diferença de no máx. 2 cm).", "src": "TRP-EX-0001 R01 / ARQ-EX-0001", "tags": ["Hype::Implantacao"]}, {"id": "imp-010", "t": "b", "f": "Qual a <b>taxa de permeabilidade</b> e a área edificada na implantação?", "b": "Permeabilidade <b>42,01%</b>; área total edificada <b>4.001,47 m²</b> (terreno 10.000 m²).", "src": "V028-ARQ-EX-0001 (Daniel Arruda)", "tags": ["Hype::Implantacao"]}, {"id": "imp-011", "t": "b", "f": "Como é a <b>locação do muro</b> do Hype?", "b": "Muro em <b>painel de concreto pré-fabricado</b>, pintura Ibratin Atmosfera, sobre sapata de concreto.", "src": "Apresentação BIM", "tags": ["Hype::Implantacao"]}, {"id": "imp-014", "t": "b", "f": "Quem assina a <b>implantação (arquitetura)</b> do Hype?", "b": "Daniel Arruda — V028-ARQ-EX-0001, projeto executivo (cliente: Praia do Futuro 2 SM Empreendimentos Imobiliários SPE Ltda).", "src": "V028-ARQ-EX-0001", "tags": ["Hype::Implantacao"]}, {"id": "imp-016", "t": "b", "f": "Quais as <b>áreas comuns</b> do Hype?", "b": "Guarita, abrigo de resíduos, churrasqueiras, casa de máquinas, redário, piscina, bicicletário, horta, pet place, quadra esportiva, salão de festas, academia, playground.", "src": "Módulo Executivo", "tags": ["Hype::Implantacao"]}, {"id": "ins-001", "t": "b", "f": "Como está o <b>esgoto externo</b>?", "b": "Projeto aprovado na <b>Cagece</b>; rede Ø150 mm PVC Ocre JEI, 334,56 m.", "src": "Apresentação BIM", "tags": ["Hype::Instalacoes"]}, {"id": "ins-002", "t": "b", "f": "Qual o <b>volume e a geometria do castelo d'água</b>?", "b": "Aduela de concreto Ø6,00 m, H = 25,45 m; <b>425.000 L</b> = consumo 360.100 + RTI 57.000 + volume morto 7.900.", "src": "Apresentação BIM / Módulo Executivo", "tags": ["Hype::Instalacoes"]}, {"id": "ins-003", "t": "b", "f": "Quais as <b>tubulações de água interna</b> por trecho?", "b": "Hidrômetro → reservatório pulmão: Ø100 PBA CL12 · castelo d'água: Ø89 CPVC · pressurização: Ø114 CPVC · torres: Ø100 PBA CL20.", "src": "Apresentação BIM", "tags": ["Hype::Instalacoes"]}, {"id": "ins-004", "t": "b", "f": "Quais as <b>tubulações enterradas</b> de incêndio e gás?", "b": "Incêndio: Ø<b>75 mm</b> em <b>PPR PN12</b>.<br>Gás: Ø<b>20 mm</b> em <b>PEX M.T.</b>, enterrado a <b>30 cm</b> de profundidade.", "src": "Apresentação BIM", "tags": ["Hype::Instalacoes"]}, {"id": "ins-005", "t": "b", "f": "Qual a situação da <b>entrada de energia</b>?", "b": "Projeto em aprovação na <b>ENEL</b> (memória de cálculo da Torre 01, 220 V).", "src": "Apresentação BIM", "tags": ["Hype::Instalacoes"]}, {"id": "ins-006", "t": "b", "f": "Como é a <b>drenagem interna</b> (tubos)?", "b": "Ø100 e 75 mm em PVC S.R e Ocre JEI; drenos Ø32 mm em PVC S.N.", "src": "Apresentação BIM", "tags": ["Hype::Instalacoes"]}, {"id": "orc-001", "t": "b", "f": "Qual o <b>VGV (CEF)</b> e o valor médio da unidade do Hype?", "b": "VGV CEF <b>R$ 175.144.000,00</b>; valor médio da unidade <b>R$ 327.985,02</b>.", "src": "Módulo Executivo", "tags": ["Hype::Orcamento"]}, {"id": "orc-002", "t": "b", "f": "Qual o <b>orçamento de lançamento</b> (fev/2026, rev. 02) e como se divide?", "b": "<b>R$ 64.689.087,72</b> = obra interna R$ 62.096.088,32 + infra externa R$ 2.592.999,40.", "src": "Módulo Executivo", "tags": ["Hype::Orcamento"]}, {"id": "orc-003", "t": "b", "f": "Qual o <b>custo por m² de área privativa</b> do orçamento de lançamento?", "b": "<b>R$ 3.020,46/m²</b>.", "src": "Módulo Executivo", "tags": ["Hype::Orcamento"]}, {"id": "orc-004", "t": "b", "f": "O <b>orçamento executivo</b> do Hype já foi elaborado?", "b": "<b>Não.</b> Só existe o orçamento de lançamento. Alessandro está levantando divergências (itens não previstos ou previstos com folga) para retroalimentá-lo.", "src": "Módulo Executivo / Alessandro", "tags": ["Hype::Orcamento"]}, {"id": "orc-005", "t": "b", "f": "O que é o <b>FRE Global</b> e por que não se compara direto ao orçamento de lançamento?", "b": "Orçamento sintético que soma <b>R$ 110.982.336,63</b>, em <b>base diferente</b> do orçamento de lançamento (R$ 64,69 mi).", "src": "Módulo Executivo", "tags": ["Hype::Orcamento"]}, {"id": "orc-006", "t": "b", "f": "Quais as maiores <b>incidências</b> do FRE Global?", "b": "Instalações <b>21,00%</b> · Supraestrutura <b>20,93%</b> · Infraestrutura e urbanização <b>15,53%</b> · Revestimentos <b>9,50%</b>.", "src": "Módulo Executivo", "tags": ["Hype::Orcamento"]}, {"id": "pla-002", "t": "b", "f": "Qual o <b>planejamento (baseline aprovada)</b> da obra?", "b": "Início <b>01/09/2026</b> · pré-obra set/26 a nov/26 (3 meses) · 1º mês de obra (primeiro radier) <b>out/26</b> · chegada das formas (estrutura) <b>15/02/2027</b> · <b>conclusão 27/09/2028</b>.<br>Prazo total: <b>25 meses</b> (3 de pré-obra + 22 de obra) / 501 dias úteis.", "src": "Termo de Aprovação de Baseline R0 (JSVP, 19/08/2026)", "tags": ["Hype::Planejamento"]}, {"id": "pla-003", "t": "b", "f": "Qual a <b>sequência executiva das torres</b> e dos módulos?", "b": "Torres: <b>T2 → T3 → T1</b>. Módulos: começa no Módulo 1, avança para o 2 e <b>volta ao 1</b>, evitando ausência de medições do Módulo 2 junto à CEF.", "src": "Módulo Executivo", "tags": ["Hype::Planejamento"]}, {"id": "sol-001", "t": "b", "f": "Como é a <b>topografia</b> do terreno?", "b": "Curvas de nível com <b>2,5 m de declive</b>, cotas de <b>10,0 a 12,5</b>.", "src": "Apresentação BIM", "tags": ["Hype::Terreno"]}, {"id": "sol-002", "t": "b", "f": "Quantos <b>furos de sondagem SPT</b> foram feitos e qual a <b>profundidade total</b> perfurada?", "b": "<b>18 furos</b>, totalizando <b>225,67 m</b> de perfuração.<br>Todos terminam por impenetrabilidade ao amostrador, entre 10,19 e 14,24 m.", "src": "V028-SON-EX-0001", "tags": ["Hype::Sondagem"]}, {"id": "sol-003", "t": "b", "f": "Quem executou a <b>sondagem SPT</b> e quando?", "b": "Sonda – Poços e Sondagens (geólogo Paulo de Azevedo Dias); campo em 05 e 06/06/2025; relatório de 13/06/2025.", "src": "V028-SON-EX-0001", "tags": ["Hype::Sondagem"]}, {"id": "sol-004", "t": "b", "f": "Qual o <b>nível d'água</b> encontrado nas sondagens?", "b": "Entre <b>2,20 m</b> (SP-04) e <b>4,00 m</b> (SP-14), medidos a partir da boca de cada furo.", "src": "V028-SON-EX-0001", "tags": ["Hype::Sondagem"]}, {"id": "sol-005", "t": "b", "f": "Descreva o <b>perfil geotécnico</b> do terreno.", "b": "Areia fina a grossa com pouca argila. Camada 1: fofa a compacta (N 2 a ~30) até ~3,6–7,6 m · Camada 2: compacta a muito compacta, com pedregulho/seixos · Camada 3: muito compacta,  "f": "O Hype possui regime de patrimônio de afetação?", "b": "Sim, instituído em 28/07/2026 (AV.79/Matrícula 6842), conforme Lei 4.591/64 com as alterações da Lei 10.931/2004 — separa o terreno e as acessões do patrimônio geral da incorporadora, destinado à conclusão da obra e entrega das unidades aos adquirentes.", "src": "Matrícula nº 6842 (5º RI Fortaleza)", "tags": ["Hype::Implantacao"]}]}</script>
<script>
/* Agendador de repetição espaçada baseado no FSRS-5 (pesos padrão).
   Estados: 0 novo · 1 aprendendo · 2 revisão · 3 reaprendendo.
   Revisão: due em "dd" (índice de dia, virada às 4h). Aprendizado: due em ms. */
const SRS = (() => {
  const W = [0.40255, 1.18385, 3.173, 15.69105, 7.1949, 0.5345, 1.4604, 0.0046, 1.54575,
             0.1192, 1.01925, 1.9395, 0.11, 0.29605, 2.2698, 0.2315, 2.9898, 0.51655, 0.6621];
  const F = 19 / 81, DECAY = -0.5;
  const MIN = 60000, DAY = 86400000;
  const LEARN = [1, 10];   // minutos
  const RELEARN = [10];    // minutos
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

  const retr = (t, s) => Math.pow(1 + F * t / s, DECAY);
  const ivFor = (s, r) => s / F * (Math.pow(r, 1 / DECAY) - 1);
  const d0 = g => clamp(W[4] - Math.exp(W[5] * (g - 1)) + 1, 1, 10);
  const s0 = g => Math.max(W[g - 1], 0.1);
  const nextD = (d, g) => clamp(W[7] * d0(4) + (1 - W[7]) * (d - W[6] * (g - 3)), 1, 10);
  const recallS = (d, s, r, g) => s * (1 + Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) *
    (Math.exp((1 - r) * W[10]) - 1) * (g === 2 ? W[15] : 1) * (g === 4 ? W[16] : 1));
  const forgetS = (d, s, r) => Math.min(s, W[11] * Math.pow(d, -W[12]) *
    (Math.pow(s + 1, W[13]) - 1) * Math.exp((1 - r) * W[14]));
  const shortS = (s, g) => s * Math.exp(W[17] * (g - 3 + W[18]));

  /* Índice do dia local, com a virada às 4h da manhã. */
  function dayIndex(ms) {
    const d = new Date(ms - 4 * 3600000);
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
  }

  function blank() { return { st: 0, s: 0, d: 0, due: 0, dd: 0, step: 0, reps: 0, lapses: 0, last: 0 }; }

  /* Aplica uma nota (1 De novo, 2 Difícil, 3 Bom, 4 Fácil) e devolve o novo estado. */
  function answer(c, g, now, cfg) {
    const r = (cfg && cfg.retention) || 0.9;
    const maxIv = (cfg && cfg.maxIv) || 3650;
    const today = dayIndex(now);
    const n = Object.assign(blank(), c || {});
    const wasNew = n.st === 0;
    const prevLast = n.last;
    n.reps += 1;
    n.last = now;

    const graduate = () => {
      n.st = 2; n.step = 0; n.due = 0;
      n.dd = today + clamp(Math.round(ivFor(n.s, r)), 1, maxIv);
    };
    const learnStep = steps => {
      if (g === 1) { n.step = 0; n.due = now + steps[0] * MIN; }
      else if (g === 2) {
        const m = (n.step === 0 && steps.length > 1) ? 5 : steps[n.step];
        n.due = now + m * MIN;
      } else if (g === 3) {
        if (n.step + 1 < steps.length) { n.step += 1; n.due = now + steps[n.step] * MIN; }
        else graduate();
      } else graduate();
    };

    if (wasNew) {
      n.s = s0(g); n.d = d0(g); n.st = 1; n.step = 0; n.lapses = 0;
      learnStep(LEARN);
    } else if (n.st === 1 || n.st === 3) {
      n.s = Math.max(0.1, shortS(n.s, g));
      learnStep(n.st === 1 ? LEARN : RELEARN);
    } else {
      const elapsed = Math.max(0.0001, (now - prevLast) / DAY);
      const R = retr(elapsed, n.s);
      if (g === 1) {
        n.s = Math.max(0.1, forgetS(n.d, n.s, R));
        n.d = nextD(n.d, 1);
        n.lapses += 1; n.st = 3; n.step = 0; n.due = now + RELEARN[0] * MIN;
      } else {
        const sH = recallS(n.d, n.s, R, 2), sG = recallS(n.d, n.s, R, 3), sE = recallS(n.d, n.s, R, 4);
        let iH = Math.max(1, Math.round(ivFor(sH, r)));
        let iG = Math.round(ivFor(sG, r));
        let iE = Math.round(ivFor(sE, r));
        iH = Math.min(iH, iG); iG = Math.max(iG, iH + 1); iE = Math.max(iE, iG + 1);
        const iv = clamp(g === 2 ? iH : g === 3 ? iG : iE, 1, maxIv);
        n.s = g === 2 ? sH : g === 3 ? sG : sE;
        n.d = nextD(n.d, g);
        n.dd = today + iv; n.due = 0;
      }
    }
    return n;
  }

  function preview(c, now, cfg) {
    return { 1: answer(c, 1, now, cfg), 2: answer(c, 2, now, cfg), 3: answer(c, 3, now, cfg), 4: answer(c, 4, now, cfg) };
  }

  const nf1 = x => (Math.round(x * 10) / 10).toString().replace('.', ',');
  function describe(n, now) {
    if (n.st === 1 || n.st === 3) {
      const m = Math.max(1, Math.round((n.due - now) / MIN));
      return m < 60 ? m + ' min' : Math.round(m / 60) + ' h';
    }
    const d = n.dd - dayIndex(now);
    if (d < 30) return d + ' d';
    if (d < 365) { const mo = d / 30.4; return mo < 1.05 ? '1 mês' : nf1(mo) + ' meses'; }
    return nf1(d / 365) + ' anos';
  }

  return { dayIndex, answer, preview, describe, retr, MIN, DAY, W };
})();
if (typeof module !== 'undefined') module.exports = SRS;

</script>
<script>
(function () {
'use strict';
const DECK = JSON.parse(document.getElementById('deck-data').textContent);
const LS_KEY = 'anki-hype:v1';
const MIN = SRS.MIN, DAY = SRS.DAY;
const LABELS = { Implantacao: 'Implantação', Fundacao: 'Fundação', Orcamento: 'Orçamento', Instalacoes: 'Instalações',
  Pavimentacao: 'Pavimentação', Estrutura: 'Estrutura', Sondagem: 'Sondagem', Terraplenagem: 'Terraplenagem',
  Planejamento: 'Planejamento', Drenagem: 'Drenagem', Terreno: 'Terreno', Documentos: 'Documentos', Niveis: 'Níveis e cotas', Radier: 'Radier', Geral: 'Geral' };
const DEFAULTS = { newPerDay: 20, maxRev: 200, retention: 0.9, newOrder: 'deck', bury: 1 };

/* ───────── utilidades ───────── */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const plain = html => { const t = document.createElement('template'); t.innerHTML = html; return (t.content.textContent || '').replace(/\s+/g, ' ').trim(); };
const nf = n => Number(n).toLocaleString('pt-BR');
const topicLabel = t => LABELS[t] || String(t).replace(/_/g, ' ');
const toHtml = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
function mergeInto(t, p) {
  for (const k of Object.keys(p)) {
    const v = p[k];
    if (v && typeof v === 'object' && !Array.isArray(v)) { t[k] = mergeInto(t[k] && typeof t[k] === 'object' && !Array.isArray(t[k]) ? t[k] : {}, v); }
    else t[k] = Array.isArray(v) ? v.slice() : v;
  }
  return t;
}
const dayKey = idx => new Date(idx * DAY).toISOString().slice(0, 10);

/* ───────── armazenamento ───────── */
const Store = {
  mode: 'local', docs: {}, pending: {}, existed: new Set(), col: null, timer: null, inflight: {}, failed: false,
  async init() {
    let db = null, uid = null;
    try {
      const auth = await window.__ankiReady;
      if (auth) { db = auth.db; uid = auth.uid; }
    } catch (e) { db = null; }
    if (db && uid) {
      try {
        this.col = db.collection('data/users/' + uid);
        const snap = await this.col.get();
        snap.docs.forEach(d => { if (d.exists) { this.docs[d.id] = clone(d.data()); this.existed.add(d.id); } });
        this.mode = 'db';
        /* rede de segurança: se a conta veio sem progresso mas este navegador guarda uma cópia, restaura */
        try {
          const mir = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
          const has = o => o && Object.keys(o).some(k => /^rev-\d$/.test(k));
          if (has(mir) && !has(this.docs)) {
            Object.keys(mir).forEach(id => { this.docs[id] = clone(mir[id]); this.pending[id] = clone(mir[id]); });
            this.schedule(300);
          }
        } catch (e) {}
        return;
      } catch (e) { this.col = null; this.docs = {}; this.existed = new Set(); }
    }
    try { const raw = localStorage.getItem(LS_KEY); if (raw) this.docs = JSON.parse(raw) || {}; } catch (e) {}
    this.mode = 'local';
  },
  merge(id, patch) {
    this.docs[id] = mergeInto(this.docs[id] || {}, clone(patch));
    this.pending[id] = mergeInto(this.pending[id] || {}, clone(patch));
    this.schedule(900);
  },
  schedule(ms) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), ms); this.status('pending'); },
  async flush() {
    const ids = Object.keys(this.pending);
    if (!ids.length) { this.status('ok'); return; }
    try { localStorage.setItem(LS_KEY, JSON.stringify(this.docs)); } catch (e) {}
    if (this.mode === 'local') { this.pending = {}; this.status('ok'); return; }
    this.status('saving'); this.failed = false;
    await Promise.all(ids.map(async id => {
      if (this.inflight[id]) return;
      const patch = this.pending[id]; delete this.pending[id];
      this.inflight[id] = true;
      try {
        const ref = this.col.doc(id);
        if (this.existed.has(id)) await ref.update(patch);
        else { await ref.set(clone(this.docs[id])); this.existed.add(id); }
      } catch (e) {
        this.failed = true;
        this.pending[id] = mergeInto(patch, this.pending[id] || {});
      } finally { this.inflight[id] = false; }
    }));
    if (Object.keys(this.pending).length) { this.schedule(this.failed ? 5000 : 600); this.status(this.failed ? 'error' : 'pending'); }
    else this.status('ok');
  },

  openOverlay('<div class="modal-head"><h2>' + (n ? 'Editar cartão' : 'Novo cartão') + '</h2><button class="btn ghost small" data-act="close" data-focus>Cancelar</button></div>' +
    '<div class="form"><div class="radios" role="radiogroup" aria-label="Tipo"><label><input type="radio" name="f-type" id="f-type-b" value="b"' + (t === 'b' ? ' checked' : '') + '> Pergunta e resposta</label>' +
    '<label><input type="radio" name="f-type" id="f-type-c" value="c"' + (t === 'c' ? ' checked' : '') + '> Lacuna (cloze)</label></div>' +
    '<div class="fld"><label for="f-front" id="f-front-l"></label><textarea class="field" id="f-front">' + esc(n ? unHtml(n.f) : '') + '</textarea><small id="f-front-h"></small></div>' +
    '<div class="fld"><label for="f-back" id="f-back-l"></label><textarea class="field" id="f-back">' + esc(n ? unHtml(n.b) : '') + '</textarea></div>' +
    '<div class="fld"><label for="f-src">Fonte (documento de origem)</label><input class="field" id="f-src" value="' + esc(n ? n.src : '') + '"></div>' +
    '<div class="fld"><label for="f-topic">Assunto</label><select class="field" id="f-topic">' + topics.map(x => '<option value="' + esc(x) + '"' + (n && n.topic === x ? ' selected' : '') + '>' + esc(topicLabel(x)) + '</option>').join('') + '<option value="__new">Novo assunto…</option></select>' +
    '<input class="field" id="f-topic-new" placeholder="Nome do novo assunto" hidden></div>' +
    '<p class="err" id="f-err" role="alert"></p><div class="row"><button class="btn primary" data-act="save-note" data-id="' + esc(id || '') + '">Salvar cartão</button></div></div>');
  syncForm();
}
function syncForm() {
  const c = $('#f-type-c') && $('#f-type-c').checked;
  $('#f-front-l').textContent = c ? 'Texto com lacunas' : 'Pergunta';
  $('#f-front-h').textContent = c ? 'Marque cada lacuna assim: {{c1::resposta}}. Use **negrito** para destacar.' : 'Use **negrito** para destacar.';
  $('#f-back-l').textContent = c ? 'Extra (opcional, aparece depois de responder)' : 'Resposta';
}
function saveNote(id) {
  const t = $('#f-type-c').checked ? 'c' : 'b', f = $('#f-front').value.trim(), b = $('#f-back').value.trim(), src = $('#f-src').value.trim();
  let topic = $('#f-topic').value; if (topic === '__new') topic = ($('#f-topic-new').value.trim().replace(/[^A-Za-z0-9À-ÿ ]/g, '').replace(/\s+/g, '_')) || 'Geral';
  const err = $('#f-err');
  if (!f) { err.textContent = 'Escreva a ' + (t === 'c' ? 'frase com lacunas.' : 'pergunta.'); return; }
  if (t === 'c' && !/\{\{c\d+::.+?\}\}/.test(f)) { err.textContent = 'Inclua ao menos uma lacuna, como {{c1::resposta}}.'; return; }
  if (t === 'b' && !b) { err.textContent = 'Escreva a resposta.'; return; }
  const nid = id || 'usr-' + Date.now().toString(36);
  const old = id ? ((Store.docs.custom || {}).notes || {})[id] : null;
  Store.merge('custom', { notes: { [nid]: { t, f: toHtml(f), b: toHtml(b), src, topic, ts: old ? old.ts : Date.now(), del: 0 } } });
  rebuild(); closeOverlay(); flash = ''; render();
}

/* ───────── estatísticas ───────── */
function plotHTML(vals, xl, tips, label) {
  const max = Math.max(4, ...vals), top = max <= 4 ? 4 : Math.ceil(max / 4) * 4;
  const mx = vals.indexOf(Math.max(...vals));
  const cols = vals.map((v, i) => '<div class="col" tabindex="0" data-tip="' + esc(tips[i]) + '"><div class="bar" style="height:' + (v / top * 100) + '%"></div>' + (v > 0 && (i === mx || i === 0) ? '<span class="val" style="bottom:calc(' + (v / top * 100) + '% + 3px)">' + v + '</span>' : '') + '</div>').join('');
  return '<div role="img" aria-label="' + esc(label) + '"><div class="plot"><div class="gl-line" style="top:0"><span>' + top + '</span></div><div class="gl-line" style="top:50%"><span>' + top / 2 + '</span></div><div class="gl-line base" style="top:100%"><span>0</span></div><div class="cols">' + cols + '</div></div>' +
    '<div class="xlabels">' + xl.map(x => '<span>' + x + '</span>').join('') + '</div></div>';
}
function tableHTML(head, rows) { return '<details class="tbl"><summary>Ver como tabela</summary><div class="tbl-wrap"><table><thead><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table></div></details>'; }
function statsHTML() {
  const now = Date.now(), today = SRS.dayIndex(now);
  const days = (Store.docs.hist || {}).days || {};
  let r30 = 0, f30 = 0, tot30 = 0; const hv = [], hl = [], ht = [], hrows = [];
  for (let i = 29; i >= 0; i--) {
    const dkk = dayKey(today - i), d = Object.assign({ n: 0, l: 0, r: 0, f: 0 }, days[dkk] || {}), t = d.n + d.l + d.r;
    hv.push(t); r30 += d.r; f30 += d.f; tot30 += t;
    const dt = new Date((today - i) * DAY), lab = dt.toLocaleDateString('pt-BR', { timeZone: 'UTC', day: '2-digit', month: '2-digit' });
    hl.push(i % 5 === 0 ? lab.slice(0, 5) : ''); ht.push(lab + ' · ' + t + ' cartões'); if (t) hrows.push([lab, d.n, d.l, d.r, d.f]);
  }
  const ret = r30 ? Math.round((1 - f30 / r30) * 100) + '%' : '—';
  const fv = new Array(14).fill(0); let nNew = 0, nLearn = 0, nYoung = 0, nMature = 0, nSus = 0;
  ITEMS.forEach(it => {
    if (isSus(it.key)) { nSus++; return; }
    const s = getSt(it.key);
    if (isNew(s)) { nNew++; return; }
    if (s.st === 1 || s.st === 3) { nLearn++; fv[0]++; return; }
    if (s.s >= 21) nMature++; else nYoung++;
    const idx = Math.max(0, s.dd - today); if (idx < 14) fv[idx]++;
  });
  const fl = [], ft = [], frows = [];
  for (let i = 0; i < 14; i++) {
    const dt = new Date((today + i) * DAY), w = dt.toLocaleDateString('pt-BR', { timeZone: 'UTC', weekday: 'narrow' }).toUpperCase(), lab = i === 0 ? 'Hoje' : i === 1 ? 'Amanhã' : dt.toLocaleDateString('pt-BR', { timeZone: 'UTC', weekday: 'short', day: '2-digit', month: '2-digit' });
    fl.push(w); ft.push(lab + ' · ' + fv[i] + ' a revisar'); frows.push([lab, fv[i]]);
  }
  const total = ITEMS.length || 1, segs = [['Novos', nNew, 'var(--c-new)'], ['Aprendendo', nLearn, 'var(--c-learn)'], ['Jovens (estab. < 21 d)', nYoung, 'var(--c-young)'], ['Maduros (estab. ≥ 21 d)', nMature, 'var(--c-mature)']];
  const doneToday = dayStat(dayKey(today)); const td = doneToday.n + doneToday.l + doneToday.r;
  return '<div class="tiles"><div class="tile"><span class="eyebrow">Respondidos hoje</span><b>' + nf(td) + '</b></div><div class="tile"><span class="eyebrow">Retenção real, 30 dias</span><b>' + ret + '</b></div><div class="tile"><span class="eyebrow">Respostas em 30 dias</span><b>' + nf(tot30) + '</b></div></div>' +
    '<section class="panel"><h3>Revisões previstas</h3><p class="hint">Cartões com revisão marcada para cada um dos próximos 14 dias. Hoje inclui os atrasados e os em aprendizado.</p>' + plotHTML(fv, fl, ft, 'Revisões previstas nos próximos 14 dias') + tableHTML(['Dia', 'Cartões'], frows) + '</section>' +
    '<section class="panel"><h3>Respostas por dia</h3><p class="hint">Últimos 30 dias, somando novos, aprendizado e revisões.</p>' + plotHTML(hv, hl, ht, 'Respostas por dia nos últimos 30 dias') + tableHTML(['Dia', 'Novos', 'Aprend.', 'Revisões', 'Erros'], hrows) + '</section>' +
    '<section class="panel"><h3>Maturidade do baralho</h3><div class="seg" role="img" aria-label="Distribuição dos cartões por maturidade">' + segs.filter(s => s[1]).map(s => '<i style="flex:' + s[1] + ';background:' + s[2] + '" data-tip="' + s[0] + ' · ' + s[1] + '"></i>').join('') + '</div>' +
    '<div class="legend">' + segs.map(s => '<div><span class="sw" style="background:' + s[2] + '"></span>' + s[0] + '<span class="v">' + nf(s[1]) + ' · ' + Math.round(s[1] / total * 100) + '%</span></div>').join('') + (nSus ? '<div><span class="sw" style="border:1px dashed var(--line-strong)"></span>Suspensos<span class="v">' + nSus + '</span></div>' : '') + '</div></section>';
}

/* ───────── ajustes ───────── */
function settingsHTML() {
  const c = cfg();
  return '<section class="panel"><h3>Estudo</h3><div class="form">' +
    '<div class="setting"><label for="set-new">Novos por dia<small>Cada cartão novo gera revisões futuras.</small></label><input class="field" id="set-new" type="number" min="0" max="200" value="' + c.newPerDay + '"></div>' +
    '<div class="setting"><label for="set-rev">Máximo de revisões por dia</label><input class="field" id="set-rev" type="number" min="0" max="999" value="' + c.maxRev + '"></div>' +
    '<div class="setting"><label for="set-ret">Retenção desejada<small>Mais alta, mais revisões. 90% é um bom ponto de partida.</small></label><div><input id="set-ret" type="range" min="80" max="97" step="1" value="' + Math.round(c.retention * 100) + '"><div class="rangeval" id="set-ret-v">' + Math.round(c.retention * 100) + '%</div></div></div>' +
    '<div class="setting"><label for="set-order">Ordem dos novos</label><select class="field" id="set-order"><option value="deck"' + (c.newOrder === 'deck' ? ' selected' : '') + '>Ordem do baralho</option><option value="random"' + (c.newOrder === 'random' ? ' selected' : '') + '>Aleatória</option></select></div>' +
    '<div class="setting"><label for="set-bury">Adiar irmãos<small>Mostra no máximo uma lacuna da mesma nota por dia.</small></label><input id="set-bury" type="checkbox"' + (c.bury ? ' checked' : '') + '></div></div></section>' +
    '<section class="panel"><h3>Onde fica o seu progresso</h3><p class="hint">Salvo só neste navegador/aparelho. Para usar em outro aparelho, exporte um backup aqui e importe lá.</p><p class="hint">Cartões já estudados: <b>' + nf(ITEMS.filter(it => !isNew(getSt(it.key))).length) + '</b> de ' + nf(ITEMS.length) + '.</p></section>' +
    '<section class="panel"><h3>Backup</h3><p class="hint">Salva o progresso e os cartões criados por você em um arquivo. Importar substitui o progresso atual pelo do arquivo.</p>' +
    '<div class="row"><button class="btn" data-act="export">Exportar progresso</button><label class="btn" for="imp-file">Importar arquivo</label><input type="file" id="imp-file" accept="application/json,.json" hidden></div><p class="err" id="bk-msg" role="status"></p></section>' +
    '<section class="panel"><h3>Zerar progresso</h3><p class="hint">Volta todos os cartões do baralho a “novo”. O histórico de estatísticas e os cartões criados por você ficam.</p><div class="row" id="reset-row"><button class="btn danger" data-act="ask-reset-all">Zerar progresso…</button></div></section>';
}
async function doExport() {
  const msg = $('#bk-msg'); const data = JSON.stringify({ app: 'anki-hype', version: DECK.version, exportedAt: new Date().toISOString(), docs: Store.docs }, null, 1);
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename: 'anki-hype-progresso.json', data }); }
    else {
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'anki-hype-progresso.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    msg.style.color = 'var(--ink-2)'; msg.textContent = 'Arquivo salvo.';
  }
  catch (e) { msg.style.color = e && e.code === 'declined' ? 'var(--ink-2)' : 'var(--again)'; msg.textContent = e && e.code === 'declined' ? 'Exportação cancelada.' : 'Não foi possível salvar o arquivo neste ambiente.'; }
}
function doImport(file) {
  const msg = $('#bk-msg'); const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result); if (!o || o.app !== 'anki-hype' || !o.docs) throw new Error();
      Object.keys(o.docs).forEach(id => { if (/^(rev-\d|hist|cfg|custom|flags)$/.test(id)) { Store.docs[id] = {}; Store.merge(id, o.docs[id]); } });
      rebuild(); msg.style.color = 'var(--good)'; msg.textContent = 'Progresso importado.';
    } catch (e) { msg.style.color = 'var(--again)'; msg.textContent = 'Arquivo inválido. Use um backup exportado pelo Anki Hype.'; }
  };
  rd.readAsText(file);
}
function resetAll() {
  ITEMS.forEach(it => { if (!isNew(getSt(it.key))) putSt(it.key, { st: 0 }); });
  undoStack = []; render();
}

/* ───────── eventos ───────── */
document.addEventListener('click', e => {
  const ov = $('#ov'); if (e.target === ov) { closeOverlay(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, key = el.dataset.key;
  switch (a) {
    case 'tab': view = el.dataset.view; render(); window.scrollTo(0, 0); break;
    case 'home': view = 'home'; render(); break;
    case 'study': startStudy(parseScope(el.dataset.scope)); break;
    case 'reveal': revealed = true; render(); break;
    case 'grade': grade(+el.dataset.g); break;
    case 'undo': undo(); break;
    case 'flag': if (cur) { setFlag('flg', cur.item.key, !isFlg(cur.item.key)); render(); } break;
    case 'suspend': if (cur) { setFlag('sus', cur.item.key, true); nextCard(); render(); } break;
    case 'more-new': extraNew += 10; nextCard(); render(); break;
    case 'open': openDetail(key); break;
    case 'close': closeOverlay(); break;
    case 'zoom': openOverlay('<div class="modal-head"><h2>Imagem</h2><button class="btn ghost small" data-act="close" data-focus>Fechar</button></div><img class="zoom" src="' + esc(el.dataset.src) + '" alt="">' + (el.dataset.cap ? '<p class="extra">' + esc(el.dataset.cap) + '</p>' : '')); break;
    case 'toggle-sus': setFlag('sus', key, !isSus(key)); openDetail(key); if (view === 'browse') renderList(); break;
    case 'toggle-flag': setFlag('flg', key, !isFlg(key)); openDetail(key); if (view === 'browse') renderList(); break;
    case 'ask-reset-card': openDetail(key, true); break;
    case 'reset-card': putSt(key, { st: 0 }); openDetail(key); if (view === 'browse') renderList(); break;
    case 'new-note': openForm(null); break;
    case 'edit-note': openForm(el.dataset.id); break;
    case 'save-note': saveNote(el.dataset.id || null); break;
    case 'del-note': Store.merge('custom', { notes: { [el.dataset.id]: { del: 1 } } }); rebuild(); closeOverlay(); render(); break;
    case 'more-rows': browse.limit += 60; renderList(); break;
    case 'export': doExport(); break;
    case 'ask-reset-all': $('#reset-row').innerHTML = '<button class="btn danger" data-act="reset-all">Confirmar: zerar todo o progresso</button><button class="btn" data-act="cancel-reset">Cancelar</button>'; break;
    case 'cancel-reset': $('#reset-row').innerHTML = '<button class="btn danger" data-act="ask-reset-all">Zerar progresso…</button>'; break;
    case 'reset-all': resetAll(); break;
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'b-q') { browse.q = e.target.value; browse.limit = 60; renderList(); }
  else if (id === 'set-ret') $('#set-ret-v').textContent = e.target.value + '%';
  else if (id === 'f-type-b' || id === 'f-type-c') syncForm();
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'b-topic') { browse.topic = e.target.value; browse.limit = 60; renderList(); }
  else if (id === 'b-status') { browse.status = e.target.value; browse.limit = 60; renderList(); }
  else if (id === 'f-topic') { $('#f-topic-new').hidden = e.target.value !== '__new'; }
  else if (id === 'set-new') Store.merge('cfg', { newPerDay: Math.max(0, Math.min(200, parseInt(e.target.value, 10) || 0)) });
  else if (id === 'set-rev') Store.merge('cfg', { maxRev: Math.max(0, Math.min(999, parseInt(e.target.value, 10) || 0)) });
  else if (id === 'set-ret') Store.merge('cfg', { retention: (+e.target.value) / 100 });
  else if (id === 'set-order') Store.merge('cfg', { newOrder: e.target.value });
  else if (id === 'set-bury') Store.merge('cfg', { bury: e.target.checked ? 1 : 0 });
  else if (id === 'imp-file' && e.target.files[0]) doImport(e.target.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#ov').hidden) { closeOverlay(); return; }
  if (view !== 'study' || !$('#ov').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (!cur) return;
  if (e.key === ' ' || e.key === 'Enter') { if (e.target.closest && e.target.closest('button') && e.key === 'Enter') return; e.preventDefault(); if (!revealed) { revealed = true; render(); } else if (e.key === ' ') grade(3); }
  else if (revealed && '1234'.indexOf(e.key) >= 0 && e.key) grade(+e.key);
  else if (e.key === 'z' || e.key === 'Z') undo();
});
const tip = $('#tip');
function showTip(el) {
  const t = el.getAttribute && el.getAttribute('data-tip'); if (!t) return;
  tip.textContent = t; tip.hidden = false;
  const r = el.getBoundingClientRect(), w = tip.offsetWidth;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + 'px';
}
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) tip.hidden = true; });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('focusout', () => { tip.hidden = true; });

/* ───────── tema claro/escuro ───────── */
(function () {
  const root = document.documentElement, btn = $('#themeBtn'), LS = 'anki-hype:theme';
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  const isDark = () => { const a = root.getAttribute('data-theme'); return a ? a === 'dark' : !!(mq && mq.matches); };
  function sync() { const d = isDark(); root.classList.toggle('is-dark', d); btn.setAttribute('aria-label', d ? 'Mudar para modo claro' : 'Mudar para modo escuro'); }
  try { const v = localStorage.getItem(LS); if (v === 'dark' || v === 'light') root.setAttribute('data-theme', v); } catch (e) {}
  btn.addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark'; root.setAttribute('data-theme', next);
    try { localStorage.setItem(LS, next); } catch (e) {}
    sync();
  });
  if (mq && mq.addEventListener) mq.addEventListener('change', sync);
  new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  sync();
})();

/* ───────── início ───────── */
(async function boot() {
  rebuild(); renderTabs();
  await Store.init();
  rebuild(); Store.status('ok'); render();
})();
})();
</script>
